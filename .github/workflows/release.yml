name: Build and Release

on:
  push:
    branches: [main]
    paths: [version.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nameplate-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        run: |
          version=$(tr -d '\n' < version.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected version.txt to contain a version such as 0.1.0" >&2
            exit 1
          }
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Build app bundle
        run: make release
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nameplate-${{ steps.version.outputs.value }}-macos-arm64
          path: |
            dist/Nameplate-${{ steps.version.outputs.value }}-macos-arm64.zip
            dist/Nameplate-${{ steps.version.outputs.value }}-macos-arm64.dmg
      - name: Create tag and GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          existing_sha=$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')
          if [[ -n "$existing_sha" && "$existing_sha" != "$GITHUB_SHA" ]]; then
            echo "$TAG already points to another commit" >&2
            exit 1
          fi
          if [[ -z "$existing_sha" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/Nameplate-${VERSION}-macos-arm64.zip" \
              "dist/Nameplate-${VERSION}-macos-arm64.dmg" --clobber
          else
            gh release create "$TAG" \
              "dist/Nameplate-${VERSION}-macos-arm64.zip" \
              "dist/Nameplate-${VERSION}-macos-arm64.dmg" \
              --title "Nameplate ${VERSION}" \
              --notes-file .github/release-notes.md \
              --prerelease
          fi
