name: Build and Release

on:
  push:
    branches: [main]
    paths: [version.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nameplate-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        run: |
          version=$(tr -d '\n' < version.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected version.txt to contain a version such as 0.1.0" >&2
            exit 1
          }
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Install DMG tool
        run: brew install create-dmg
      - name: Configure signing and notarization
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/configure-release-signing.sh
      - name: Build signed and notarized release artifacts
        run: make release
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/nameplate-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/nameplate-signing.p12" "$RUNNER_TEMP/nameplate-notary.p8"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nameplate-${{ steps.version.outputs.value }}-macos-arm64
          path: |
            dist/Nameplate-${{ steps.version.outputs.value }}-macos-arm64.zip
            dist/Nameplate-${{ steps.version.outputs.value }}-macos-arm64.dmg
      - name: Create tag
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const ref = `tags/${process.env.TAG}`;
            try {
              const existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
              });
              if (existing.data.object.sha !== context.sha) {
                throw new Error(`${process.env.TAG} already points to another commit`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/${ref}`,
                sha: context.sha,
              });
            }
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: Nameplate ${{ steps.version.outputs.value }}
          artifacts: dist/Nameplate-${{ steps.version.outputs.value }}-macos-arm64.zip,dist/Nameplate-${{ steps.version.outputs.value }}-macos-arm64.dmg
          artifactErrorsFailBuild: true
          prerelease: true
          generateReleaseNotes: true
          allowUpdates: true
          replacesArtifacts: true
