name: Update Homebrew cask

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      GH_APP_ID:
        required: true
      GH_APP_PRIVATE_KEY:
        required: true
  release:
    types: [published, released, edited]
  workflow_dispatch:
    inputs:
      version:
        description: Version, empty uses latest stable
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-release
  cancel-in-progress: false

jobs:
  update-cask:
    if: github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    steps:
      - uses: prnvbn/gha/homebrew-release@main
        with:
          package-type: cask
          app-id: ${{ secrets.GH_APP_ID }}
          app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          version: ${{ inputs.version }}
          cask: nameplate
          asset: Nameplate-{version}-macos-arm64.dmg
          app-name: Nameplate
          description: Readable window labels in macOS Mission Control
          homepage: https://github.com/prnvbn/Nameplate
          macos: tahoe
          arch: arm64
